name: Deploy Static Site

on:
  push:
    branches:
      - main  # 배포할 브랜치 이름 (main 또는 master)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    # [디버깅 & 수정] ls로 파일 확인 후 sed 실행
      - name: Inject API Key
        run: |
          echo "📂 현재 디렉토리 파일 목록 확인:"
          ls -R js/
          
          echo "🔄 키 치환 시도 중..."
          # 만약 js/map.js 파일이 존재하면 치환 실행
          if [ -f "js/map.js" ]; then
            sed -i 's|YOUR_CLIENT_ID_HERE|${{ secrets.YOUR_CLIENT_ID }}|g' js/map.js
            echo "✅ 치환 명령 실행 완료"
          else
            echo "❌ 에러: js/map.js 파일을 찾을 수 없습니다!"
            exit 1
          fi
          
          # (선택사항) 잘 바뀌었는지 확인 (비밀키 노출 방지를 위해 앞 5자리만 출력하거나 확인용 텍스트 출력)
          # grep으로 플레이스홀더가 남아있는지 확인 (없어야 성공)
          if grep -q "YOUR_CLIENT_ID_HERE" js/map.js; then
            echo "❌ 실패: 파일 내에 아직 'YOUR_CLIENT_ID_HERE'가 남아있습니다."
            exit 1
          else
            echo "🎉 성공: 플레이스홀더가 성공적으로 제거되었습니다."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
