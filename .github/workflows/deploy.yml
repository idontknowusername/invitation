name: Deploy Static Site

on:
  push:
    branches:
      - main  # 배포할 브랜치 이름 (main 또는 master)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # [핵심] sed 명령어로 텍스트 치환
      # map.js 파일 안에 있는 "YOUR_CLIENT_ID_HERE"라는 글자를
      # GitHub Secret에 저장된 실제 키 값으로 바꿔치기 합니다.
      - name: Inject API Key
        run: |
          sed -i 's\YOUR_CLIENT_ID_HERE\${{ secrets.YOUR_CLIENT_ID }}\g' js/map.js
        # 만약 js 파일이 js/script.js 처럼 폴더 안에 있다면 경로를 맞춰주세요.

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
