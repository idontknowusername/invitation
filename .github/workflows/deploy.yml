name: Deploy Static Site

on:
  push:
    branches:
      - main  # 배포할 브랜치 이름 (main 또는 master)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Environment Variables
        run: |
          echo "Current directory:"
          ls -R

          echo "🔄 환경변수 치환 시도 중..."
          
          # env.js 파일이 존재하는지 확인
          if [ -f "env.js" ]; then
            # sed를 사용하여 env.js 내의 플레이스홀더를 GitHub Secrets 값으로 치환
            # (주의: Secrets에 특수문자가 포함된 경우를 대비해 구분자로 | 사용)
            sed -i 's|MY_LOCAL_MAP_API_KEY|${{ secrets.MY_LOCAL_MAP_API_KEY }}|g' env.js
            sed -i 's|MY_GROOM_NAME_EN|${{ secrets.MY_GROOM_NAME_EN }}|g' env.js
            sed -i 's|MY_BRIDE_NAME_EN|${{ secrets.MY_BRIDE_NAME_EN }}|g' env.js
            sed -i 's|MY_GROOM_NAME|${{ secrets.MY_GROOM_NAME }}|g' env.js
            sed -i 's|MY_BRIDE_NAME|${{ secrets.MY_BRIDE_NAME }}|g' env.js
            
            echo "✅ env.js 치환 완료"
            
            # 치환 결과 확인 (보안상 값은 출력하지 않고, 플레이스홀더 존재 여부만 체크)
            if grep -q "MY_LOCAL_MAP_API_KEY" env.js; then
              echo "❌ 실패: env.js 내에 아직 'MY_LOCAL_MAP_API_KEY'가 남아있습니다."
              exit 1
            else
              echo "🎉 성공: 모든 환경변수가 성공적으로 적용되었습니다."
            fi
            
          else
            echo "❌ 에러: env.js 파일을 찾을 수 없습니다!"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
