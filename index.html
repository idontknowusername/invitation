<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        /* --- 1. 기본 설정 --- */
        :root {
            --sea-color: #58a6ff; /* 밝은 바다색 */
            --deep-sea: #0d47a1;  /* 깊은 바다색 */
            --sand-bg: #fdfbf7;
            --text-main: #333;
            --accent: #0d47a1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Serif KR', serif;
            background-color: #e0e0e0; /* PC 배경 */
            overflow: hidden; /* 초기 스크롤 방지 */
        }

        /* 모바일 뷰 컨테이너 */
        .container {
            position: relative;
            max-width: 500px;
            width: 100%;
            height: 100vh; /* 초기 높이 고정 */
            margin: 0 auto;
            background-color: var(--sand-bg);
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            overflow: hidden; /* 내부 스크롤 제어 */
        }

        /* --- 2. 메인 본문 (초기에 가려져 있음) --- */
        .main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto; /* 오프닝 후 스크롤 가능 */
            padding: 80px 30px 40px;
            opacity: 0;
            transition: opacity 1s ease 0.5s; /* 천천히 나타남 */
            z-index: 1; /* Entrance 뒤에 위치 */
            
            /* 스크롤바 숨김 (디자인적 요소) */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .main-content::-webkit-scrollbar { display: none; }

        /* 본문 내용 스타일 */
        .invite-header { text-align: center; margin-bottom: 50px; }
        .invite-header h2 { font-family: 'Montserrat', sans-serif; font-size: 0.9rem; letter-spacing: 2px; color: var(--accent); margin-bottom: 10px; }
        .invite-header h1 { font-size: 1.8rem; margin-bottom: 30px; line-height: 1.4; }
        .divider { width: 1px; height: 40px; background: #ddd; margin: 0 auto 30px; }
        
        .names-area { text-align: center; font-size: 1.1rem; margin-bottom: 60px; }
        .names-area span { font-weight: 700; font-size: 1.3rem; }

        .details-box {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
        }
        .date-text { font-size: 2.5rem; color: var(--accent); font-family: 'Montserrat', sans-serif; font-weight: 300; margin-bottom: 10px;}
        .place-text { color: #666; font-size: 1rem; line-height: 1.6; }

        /* --- 3. Entrance (덮개 화면) --- */
        .entrance-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, var(--sea-color) 0%, var(--deep-sea) 100%);
            z-index: 100; /* 최상단 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 1.5s cubic-bezier(0.65, 0, 0.35, 1); /* 물결 쓸려가는 애니메이션 속도 */
        }

        /* 오프닝 애니메이션 클래스 */
        .entrance-screen.open {
            transform: translateY(110%); /* 화면 아래로 완전히 이동 */
        }

        /* 상단 파도 모양 (Entrance가 내려갈 때 윗부분이 물결치도록) */
        .wave-top-edge {
            position: absolute;
            top: -50px; /* 화면 밖 상단에 위치하다가 내려오면서 보임 */
            left: 0;
            width: 100%;
            height: 52px;
            z-index: 101;
        }
        .wave-top-edge svg {
            width: 100%;
            height: 100%;
            fill: var(--sea-color); /* 바다색과 연결 */
            transform: rotate(180deg); /* 뒤집어서 물이 쏟아지는 모양 */
        }

        /* 요트 애니메이션 */
        .yacht-container {
            position: relative;
            z-index: 102;
            animation: float 3s ease-in-out infinite;
        }
        .yacht-svg { width: 100px; drop-shadow(0 10px 10px rgba(0,0,0,0.2)); }

        .entrance-text {
            color: white;
            margin-top: 30px;
            text-align: center;
            opacity: 1;
            transition: opacity 0.5s;
        }
        .entrance-text p { font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 5px; }
        .entrance-text h1 { font-size: 2rem; font-weight: 300; font-family: 'Montserrat', sans-serif;}

        /* 스크롤 유도 화살표 */
        .scroll-hint {
            position: absolute;
            bottom: 40px;
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            animation: bounce 2s infinite;
            text-align: center;
        }

        /* Keyframes */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

    </style>
</head>
<body>

<div class="container">
    
    <div class="main-content" id="mainContent">
        <div class="invite-header">
            <h2>WEDDING INVITATION</h2>
            <div class="divider"></div>
            <h1>저희 두 사람<br>하나가 됩니다</h1>
            <p style="color:#666; font-size:0.95rem; line-height:1.8;">
                푸른 파도처럼 깊고 넓은 사랑으로<br>
                서로를 감싸 안으며 살아가겠습니다.<br>
                그 시작의 자리에<br>
                귀한 발걸음 하시어 축복해 주십시오.
            </p>
        </div>

        <div class="names-area">
            김철수 · 이영희 <small>의 장남</small> <span>민수</span><br>
            박영식 · 최순자 <small>의 장녀</small> <span>지은</span>
        </div>

        <div class="details-box">
            <div class="date-text">2025.08.24</div>
            <p style="font-weight:bold; margin-bottom:15px; color:#333;">토요일 오후 12시 30분</p>
            <p class="place-text">
                그랜드 호텔 2층 오션뷰 홀<br>
                (서울시 강남구 테헤란로 123)
            </p>
        </div>

        <div style="height: 100px;"></div> <div style="text-align: center;">
            <button style="padding:15px 30px; background:var(--accent); color:fff; border:none; border-radius:30px; color:white; font-size:1rem;">
                오시는 길 보기
            </button>
        </div>
        
        <div style="height: 100px;"></div>
    </div>

    <div class="entrance-screen" id="entranceScreen">
        
        <div class="wave-top-edge">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z"></path>
            </svg>
        </div>

        <div class="yacht-container">
            <svg class="yacht-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10 L50 60 L80 60 Z" fill="white"/> 
                <path d="M45 20 L45 60 L15 60 Z" fill="#eee"/>
                <path d="M15 65 L85 65 C85 65 90 85 50 85 C10 85 15 65 15 65 Z" fill="white"/>
            </svg>
        </div>

        <div class="entrance-text">
            <p>MINSU & JIEUN</p>
            <h1>We are<br>Getting Married</h1>
        </div>

        <div class="scroll-hint">
            <p>Scroll Down</p>
            <p>▼</p>
        </div>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const entrance = document.getElementById('entranceScreen');
        const content = document.getElementById('mainContent');
        let isOpened = false; // 오프닝 실행 여부 체크

        // 오프닝 애니메이션 함수
        const triggerOpening = () => {
            if (isOpened) return; // 이미 열렸으면 무시
            isOpened = true;

            // 1. Entrance 화면을 아래로 내림 (CSS class 추가)
            entrance.classList.add('open');

            // 2. 본문 투명도 해제 (부드럽게 등장)
            content.style.opacity = '1';

            // 3. 애니메이션이 끝난 후, 뒤쪽의 Entrance를 DOM에서 숨김 처리 (성능 최적화)
            setTimeout(() => {
                entrance.style.display = 'none';
                // 본문 스크롤 활성화 (모바일 경험 향상)
                content.style.overflowY = 'auto'; 
            }, 1500); // CSS transition 시간과 맞춤
        };

        // --- 이벤트 리스너 등록 ---

        // 1. 마우스 휠 (PC)
        window.addEventListener('wheel', (e) => {
            // 아래로 스크롤(deltaY > 0) 할 때만 트리거
            if (e.deltaY > 0 && !isOpened) {
                triggerOpening();
            }
        });

        // 2. 터치 이벤트 (모바일)
        let touchStartY = 0;
        
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (isOpened) return;

            const touchEndY = e.touches[0].clientY;
            const diff = touchStartY - touchEndY;

            // 터치를 아래에서 위로 쓸어올리는 동작(화면을 아래로 내리려는 의도) 감지
            // 민감도 조절: 50px 이상 움직였을 때
            if (diff > 50) { 
                triggerOpening();
            }
        }, { passive: true }); // 스크롤 성능 향상
    });
</script>

</body>
</html>
